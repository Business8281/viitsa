<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Premium Emerald Teal Gradient matching VIITSA Healthcare Brand -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="40%" stop-color="#0F6E56"/>
      <stop offset="100%" stop-color="#05C994"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#022c22" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="124" fill="url(#brandGrad)"/>
  <rect x="10" y="10" width="492" height="492" rx="114" fill="none" stroke="url(#innerGlow)" stroke-width="6"/>

  <!-- Modern Ultra-Crisp Sans-Serif "1+" Glyphs -->
  <g filter="url(#softGlow)" fill="#FFFFFF">
    <!-- Clean Solid Number 1 -->
    <path d="
      M 240 140
      L 240 368
      C 240 372.4, 236.4 376, 232 376
      L 176 376
      C 171.6 376, 168 372.4, 168 368
      L 168 214
      L 130 242
      C 127 244.2, 122.8 243.6, 120.4 240.4
      L 100 213.2
      C 97.6 210, 98.2 205.8, 101.4 203.4
      L 184 140
      L 240 140
      Z
    "/>

    <!-- Bold Medical Plus Sign (+) -->
    <rect x="290" y="234" width="124" height="44" rx="14" />
    <rect x="330" y="194" width="44" height="124" rx="14" />
  </g>
</svg>